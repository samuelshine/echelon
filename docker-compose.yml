# Containerized Echelon stack. Assumes a co-located monorepo layout:
#   pipeline/  (rnd branch)   gateway/ (backend branch)   console/ (frontend branch)
# See DEMO.md "Consolidation". Bring up: docker compose up --build
services:
  policy-assistant:
    build:
      context: .
      dockerfile: deploy/Dockerfile.policy-assistant
    environment:
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-4.1-mini}
      POLICY_DATA_DIR: /data
      PORT: "8100"
    volumes:
      - policy-assistant-data:/data
    ports: ["8100:8100"]

  security:
    build:
      context: ./pipeline
      dockerfile: ../deploy/Dockerfile.security
    environment:
      ECHELON_MODEL_DIR: /app/models/layer2-threat-distilbert/best
      PORT: "8099"
      # Optional local LLM judge. Ollama runs on the HOST, so reach it via
      # host.docker.internal (not localhost, which is the container).
      ECHELON_OLLAMA_MODEL: ${ECHELON_OLLAMA_MODEL:-}
      ECHELON_OLLAMA_URL: ${ECHELON_OLLAMA_URL:-http://host.docker.internal:11434}
    # The trained model weights are git-ignored; bake them into the image or mount:
    volumes:
      - ./pipeline/models:/app/models:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose: ["8099"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8099/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Local/dev parity for RATE_LIMIT_BACKEND=redis. Internal-only (no host port
  # mapping, no auth) — reachable from other services as redis:6379. The gateway
  # service below still defaults to the in-memory backend; set RATE_LIMIT_BACKEND
  # and REDIS_URL=redis://redis:6379/0 in its environment to opt in.
  redis:
    image: redis:7-alpine
    expose: ["6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Local/dev parity for AUDIT_DATABASE_URL. Internal-only (no host port mapping) —
  # reachable from the gateway as postgres:5432. This one instance backs three
  # durable stores: the audit sink (prompt_events), the mutable API-key store
  # (api_keys), and runtime threshold/toggle overrides (runtime_config). The
  # gateway service below still defaults to fully in-memory; set
  # AUDIT_DATABASE_URL=postgres://echelon:echelon@postgres:5432/echelon?sslmode=disable
  # in its environment to opt in (also enables key auth with a from-zero bootstrap).
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: echelon
      POSTGRES_PASSWORD: echelon
      POSTGRES_DB: echelon
    expose: ["5432"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "echelon"]
      interval: 10s
      timeout: 5s
      retries: 10

  gateway:
    build:
      context: ./gateway
      dockerfile: ../deploy/Dockerfile.gateway
    environment:
      ML_BASE_URL: http://security:8099/classify
      JUDGE_BASE_URL: http://security:8099/judge
      EGRESS_ML_BASE_URL: http://security:8099/classify_response
      EGRESS_JUDGE_BASE_URL: http://security:8099/judge_response
      UPSTREAM_BASE_URL: ${UPSTREAM_BASE_URL:-https://api.openai.com}
      UPSTREAM_API_KEY: ${UPSTREAM_API_KEY:-}
      ECHELON_API_KEYS: ${ECHELON_API_KEYS:-sk-demo:acme:key_live:pro}
      HTTP_ADDR: ":8080"
      SECURITY_FAIL_CLOSED: "true"
      # Widened budgets so the (slow) LLM judge fits within the request deadline —
      # EGRESS_TIMEOUT covers the response classifier+judge as a single scanner call.
      ML_TIMEOUT: "2s"
      JUDGE_TIMEOUT: "15s"
      EGRESS_TIMEOUT: "16s"
      UPSTREAM_TIMEOUT: "15s"
      REQUEST_TIMEOUT: "50s"
      HTTP_WRITE_TIMEOUT: "60s"
    ports: ["8080:8080"]
    depends_on:
      security:
        condition: service_healthy

  console:
    build:
      context: ./console
      dockerfile: ../deploy/Dockerfile.console
      args:
        NEXT_PUBLIC_ECHELON_API_URL: ${NEXT_PUBLIC_ECHELON_API_URL:-http://localhost:8080}
    ports: ["3000:3000"]
    depends_on: [gateway]

volumes:
  policy-assistant-data:
